<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep sophisticated violet to royal indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <!-- Accent Gradient: Magical glowing pink-purple -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded squircle container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner glowing ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />
  
  <!-- Calendar symbol with shadow -->
  <g filter="url(#shadow)">
    <!-- Calendar back board (White) -->
    <rect x="128" y="144" width="256" height="240" rx="32" fill="#ffffff" />
    
    <!-- Calendar header strip (Indigo-600) -->
    <path d="M 128 176 A 16 16 0 0 1 144 144 L 368 144 A 16 16 0 0 1 384 176 L 384 216 L 128 216 Z" fill="#4f46e5" />
    
    <!-- Spiral Rings / Binder loops -->
    <rect x="176" y="112" width="16" height="48" rx="8" fill="#e2e8f0" stroke="#4338ca" stroke-width="4" />
    <rect x="248" y="112" width="16" height="48" rx="8" fill="#e2e8f0" stroke="#4338ca" stroke-width="4" />
    <rect x="320" y="112" width="16" height="48" rx="8" fill="#e2e8f0" stroke="#4338ca" stroke-width="4" />
    
    <!-- AI Sparkle / Magic Star on Calendar to represent AgendaMaster AI -->
    <path d="M 320 280 Q 320 310 350 310 Q 320 310 320 340 Q 320 310 290 310 Q 320 310 320 280 Z" fill="url(#glowGrad)" />
    
    <!-- Grid elements representing days / tasks -->
    <rect x="168" y="248" width="32" height="24" rx="6" fill="#e2e8f0" />
    <rect x="216" y="248" width="32" height="24" rx="6" fill="#e2e8f0" />
    <rect x="264" y="248" width="32" height="24" rx="6" fill="#e2e8f0" />
    
    <rect x="168" y="288" width="32" height="24" rx="6" fill="#e2e8f0" />
    <rect x="216" y="288" width="32" height="24" rx="6" fill="#e2e8f0" />
    
    <rect x="168" y="328" width="32" height="24" rx="6" fill="#e2e8f0" />
    <rect x="216" y="328" width="32" height="24" rx="6" fill="#4f46e5" /> <!-- Marked check day -->
  </g>
</svg>
